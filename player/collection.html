<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>暖光仓库 · A2Game</title>
<style>
:root{font-family:"Microsoft YaHei",system-ui,sans-serif;color:#293f43;background:#f5efdf}*{box-sizing:border-box}body{margin:0}button,select{font:inherit;color:inherit}button{cursor:pointer;border:1px solid #b5baa4;background:transparent;border-radius:12px;padding:11px 16px;min-height:44px}button:hover,button[aria-current=true]{background:#dfdfc6}button:disabled{opacity:.45;cursor:default}button:focus-visible,select:focus-visible{outline:3px solid #a86d33;outline-offset:3px}main{max-width:1000px;margin:auto;padding:30px 28px}header{display:flex;justify-content:space-between;align-items:center;gap:16px}.eyebrow{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#63786a}h1{font:600 clamp(28px,5vw,46px)/1.15 Georgia,"Microsoft YaHei",serif;margin:8px 0}p{line-height:1.65;margin:8px 0;color:#617269}nav{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0 18px}nav button{flex:1;text-align:left}nav small{display:block;margin-top:5px;font-size:12px}section{border-top:1px solid #c9c8b4;padding-top:16px}.heading{display:flex;justify-content:space-between;gap:12px;align-items:center}h2{font-size:19px;margin:0}#moves{font-variant-numeric:tabular-nums;white-space:nowrap}iframe{width:100%;height:clamp(250px,40vh,360px);border:0;display:block;background:#f5efdf}#message{min-height:27px;text-align:center;color:#435f46;font-weight:600}.controls{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.pad{display:grid;grid-template-columns:repeat(3,48px);gap:5px}.pad button{padding:8px}.pad button:first-child{grid-column:2}.pad button:nth-child(2){grid-column:1}.tools{display:flex;gap:8px;flex-wrap:wrap}footer{margin-top:24px;font-size:12px;color:#718074}select{background:transparent;border:1px solid #b5baa4;border-radius:10px;padding:8px;max-width:150px}#error{white-space:pre-wrap;color:#923b27}[hidden]{display:none!important}@media(max-width:530px){main{padding:20px 14px}header{align-items:flex-start}nav{gap:6px;margin:18px 0}nav button{padding:10px 8px;font-size:13px}nav small{font-size:11px}.heading{font-size:13px}h2{font-size:17px}iframe{height:350px;max-height:47svh}.controls{justify-content:center}.tools{justify-content:center}}
</style></head><body><main>
<header><div><div class="eyebrow">A2GAME / LUMEN DEPOT</div><h1 id="title">暖光仓库</h1><p id="subtitle">把每一束光，送回家。</p></div><label>画面引擎<br><select id="backend"><option value="air">CocosAirJS</option><option value="three">Three.js</option></select></label></header>
<nav id="levels" aria-label="选择关卡"></nav><section><div class="heading"><h2 id="levelTitle">加载关卡…</h2><span id="moves">0 步</span></div><p id="hint"></p>
<iframe id="game" title="推箱子游戏画面" allow="autoplay"></iframe><p id="message" role="status" aria-live="polite"></p>
<div class="controls"><div class="pad" aria-label="移动"><button data-action="up" aria-label="向上">↑</button><button data-action="left" aria-label="向左">←</button><button data-action="down" aria-label="向下">↓</button><button data-action="right" aria-label="向右">→</button></div><div class="tools"><button id="undo">撤销 Z</button><button id="retry">重试 R</button><button id="pause">暂停 P</button><button id="sound" aria-pressed="false">声音：关</button><button id="next" hidden>下一关 →</button></div></div>
<p id="error" role="alert"></p><button id="reload" hidden>重新加载</button></section><footer>方向键移动 · 将所有暖光箱送到光圈 · 随时撤销和重试<br>本地原创内容参考作品，不代表独立模型或正式 G3 验收。</footer>
</main><script type="module" src="./collection.mjs"></script></body></html>
