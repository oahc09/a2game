<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A2Game · Shared table</title><style>
:root{color-scheme:dark;background:#111a24;color:#e4edf2;font-family:"Segoe UI","Microsoft YaHei",sans-serif;--muted:#9bafbe;--line:#34434d;--accent:#aee3cc}*{box-sizing:border-box}body{margin:0}main{max-width:1180px;margin:auto;padding:28px 22px}header{border-bottom:1px solid var(--line);padding-bottom:20px}.eyebrow{font:12px Consolas,monospace;letter-spacing:.15em;color:var(--accent)}h1{font:400 clamp(28px,4vw,48px) Georgia,"Noto Serif SC",serif;letter-spacing:-.04em;margin:14px 0}p{font-size:14px;line-height:1.8;color:var(--muted)}a{color:var(--accent)}.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:20px 0}button,input,select{background:transparent;border:1px solid var(--line);color:inherit;padding:10px 12px;border-radius:3px;font:inherit}button{cursor:pointer}button:hover{border-color:var(--accent)}button:disabled{opacity:.4;cursor:default}#create{background:var(--accent);color:#112b21;font-weight:600}input{min-width:0;width:min(100%,340px)}input:focus,button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:24px}.stage{height:560px;border:1px solid var(--line);position:relative;background:#0d1729}canvas{width:100%;height:100%;display:block;touch-action:none}aside{border-top:2px solid var(--accent);padding-top:18px}.caption{font:11px Consolas,monospace;color:var(--muted);letter-spacing:.1em}#turn{font:32px Georgia,"Noto Serif SC",serif;margin:14px 0 22px}#actions{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}#actions button{padding:8px 2px;font:12px Consolas,monospace}dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px 12px;font-size:12px}dt{color:var(--muted)}dd{margin:0;overflow-wrap:anywhere;font-family:Consolas,monospace}#message{min-height:24px;white-space:pre-wrap}#message[data-error=true]{color:#ffb4a3}@media(max-width:720px){main{padding:20px 14px}.layout{grid-template-columns:1fr}.stage{height:410px}aside{padding-top:12px}#turn{font-size:24px;margin:10px 0}#actions{grid-template-columns:repeat(5,1fr)}}
</style></head><body><main><header><div class="eyebrow">A2GAME / SHARED TABLE</div><h1>同一局，不同画面。</h1><p>创建一张双人棋桌，把房间号交给本机另一标签页。两端可选择不同引擎，轮流落子。</p><a href="/player/index.html">返回播放器 ↗</a></header>
<div class="toolbar"><label for="backend">引擎</label><select id="backend"><option value="three">Three.js</option><option value="air">CocosAirJS</option></select><button id="create">创建五子棋桌</button><label for="roomId">房间号</label><input id="roomId" autocomplete="off" placeholder="粘贴房间号"><button id="join">加入</button></div>
<p id="message" role="status" aria-live="polite">本机公开回合参考；需以 A2GAME_ROOMS=1 启动服务。连接凭据仅留在当前页面内存。</p>
<div class="layout"><section class="stage"><canvas id="GameCanvas" aria-label="五子棋盘"></canvas></section><aside><div class="caption">YOUR TABLE / 当前棋局</div><div id="turn">等待入座</div><div id="actions" aria-label="落子按钮"></div><dl><dt>席位</dt><dd id="seat">—</dd><dt>版本</dt><dd id="version">—</dd><dt>房间号</dt><dd id="room">—</dd><dt>状态哈希</dt><dd id="hash">—</dd></dl><div class="toolbar"><button id="disconnect" disabled>暂停同步</button><button id="reconnect" disabled>恢复同步</button><button id="close" disabled>关闭棋桌</button></div><p>刷新页面会丢失席位；暂停同步后可在当前页面恢复。棋桌十分钟后过期。仅支持公开回合，隐藏手牌及互联网联机另行验收。</p></aside></div>
</main><script type="importmap">{"imports":{"cannon-es":"/player/physics/cannon-es.js"}}</script><script type="module" src="./room.mjs"></script></body></html>
