<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A2Game · Replay desk</title>
<style>
:root{color-scheme:dark;--paper:#111a24;--ink:#e4edf2;--muted:#9bafbe;--line:#34434d;--accent:#aee3cc;font-family:"Segoe UI","Microsoft YaHei",sans-serif;background:var(--paper);color:var(--ink)}*{box-sizing:border-box}body{margin:0}main{max-width:1400px;margin:auto;padding:28px 24px}header{display:flex;align-items:baseline;justify-content:space-between;gap:20px;border-bottom:1px solid var(--line);padding-bottom:22px}h1{font-family:Georgia,"Noto Serif SC",serif;font-weight:400;font-size:clamp(30px,4vw,50px);letter-spacing:-.04em;margin:10px 0}.eyebrow{font:12px Consolas,monospace;color:var(--accent);letter-spacing:.14em}.intro{color:var(--muted);max-width:650px;font-size:14px;line-height:1.8}a{color:var(--accent)}.toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:12px;margin:24px 0}button,select,.upload{border:1px solid var(--line);background:transparent;color:var(--ink);padding:10px 14px;font:inherit;border-radius:3px;cursor:pointer}button:hover,.upload:hover{border-color:var(--accent)}button:disabled{opacity:.4;cursor:default}.upload{background:var(--accent);color:#112b21;font-weight:600}.upload input{position:absolute;width:1px;height:1px;opacity:0}.upload:focus-within,button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:4px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:24px}iframe{width:100%;height:900px;border:1px solid var(--line);background:#080f1c;border-radius:3px}aside{border-top:2px solid var(--accent);padding-top:18px}.caption{font:11px Consolas,monospace;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}.position{font:52px Georgia,serif;margin:8px 0 22px}.position small{font-size:20px;color:var(--muted)}input[type=range]{width:100%;accent-color:var(--accent)}dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px 12px;font-size:13px}dt{color:var(--muted)}dd{margin:0;overflow-wrap:anywhere;font-family:Consolas,monospace}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.7 Consolas,monospace;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}#message{min-height:28px;font-size:13px;color:var(--muted);white-space:pre-wrap}#message[data-error=true]{color:#ffb4a3}.empty{padding:90px 24px;text-align:center;border:1px dashed var(--line);color:var(--muted);font-size:14px;line-height:2}@media(max-width:760px){main{padding:20px 14px}.layout{grid-template-columns:1fr}header{display:block}aside{order:-1}iframe{height:1150px}.position{font-size:32px;margin:8px 0}dl{grid-template-columns:auto 1fr}.toolbar{gap:8px}}
</style></head>
<body><main><header><div><div class="eyebrow">A2GAME / REPLAY DESK</div><h1>逐步看见，同一份逻辑。</h1><p class="intro">导入生成流程的调试包。向前执行一项操作，或回到任意位置，查看同一份 JSON 在不同引擎中的状态。</p></div><a href="/player/index.html">返回播放器 ↗</a></header>
<div class="toolbar"><label class="upload">导入调试包<input id="bundle" type="file" accept="application/json,.json"></label><label for="backend">引擎</label><select id="backend"><option value="three">Three.js</option><option value="air">CocosAirJS</option><option value="preview">Canvas2D 预览</option></select><button id="previous" disabled>← 上一步</button><button id="next" disabled>下一步 →</button><button id="reset" disabled>回到开始</button></div><p id="message" role="status" aria-live="polite">等待 debug-bundle.json；文件在本机完整校验后加载。</p>
<div class="layout"><section id="surface"><div id="empty" class="empty">导入一个调试包，开始检查关卡。<br>操作只在你点击下一步时执行。</div><iframe id="player" title="游戏回放" hidden></iframe></section><aside><div class="caption">Operation / 操作</div><div class="position"><span id="position">0</span> <small>/ <span id="total">0</span></small></div><label for="seek" class="caption">跳转到操作位置</label><input id="seek" type="range" min="0" max="0" value="0" disabled><dl><dt>Tick</dt><dd id="tick">—</dd><dt>状态</dt><dd id="flow">—</dd><dt>SHA-256</dt><dd id="hash">—</dd></dl><pre id="operation">尚无操作</pre><p class="intro">回退会重开并重放操作。暂停冻结逻辑时间。浏览器、资源与输入限制沿用正式播放器。</p></aside></div>
</main><script type="module" src="./inspect.mjs"></script></body></html>
