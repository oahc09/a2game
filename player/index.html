<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d1729'/%3E%3Cpath d='M7 25 14 7h4l7 18h-5l-1-4h-6l-1 4zm7-8h4l-2-6z' fill='%2357d7c8'/%3E%3C/svg%3E"/>
  <meta name="color-scheme" content="dark"/>
  <title>A2Game 1.0.0 · JSON Player</title>
  <script type="importmap">
    {"imports":{"three":"/player/vendor/three.module.js","cocosair.js":"/player/vendor/cocosair.js","cannon-es":"/player/physics/cannon-es.js"}}
  </script>
  <style>
  :root{font-family:"Segoe UI","Microsoft YaHei",sans-serif;color:#e2efff;background:#080f1c;--muted:#a8bbd1}
  *{box-sizing:border-box}html,body{margin:0;min-height:100%;overflow-x:hidden}
  main{max-width:1120px;margin:auto;padding:26px 20px 44px}
  header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:20px;margin-bottom:20px}
  .logo{font-weight:800;font-size:20px;letter-spacing:.04em}.tag{font-size:12px;letter-spacing:.11em;color:#76ccdf}
  h1{font-size:clamp(22px,3vw,34px);margin:10px 0 4px;letter-spacing:-.02em}p{color:var(--muted);margin:6px 0 14px;line-height:1.6}
  .pill{border:1px solid #35516c;border-radius:20px;padding:7px 12px;color:#adc2d6;font-size:12px}
  .toolbar,.actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
  .toolbar>label{display:flex;align-items:center;gap:6px;min-width:0;max-width:100%}.toolbar select{min-width:0;max-width:460px}
  #gamepadEnable{grid-column:1 / -1;justify-self:start;white-space:nowrap}
  #gamepadStatus{grid-column:1 / -1;font-size:12px;line-height:1.6;color:var(--muted);text-align:left}
  select,button,.import-control{border:1px solid #3a526f;border-radius:10px;background:#1b2a40;color:#f2f8ff;padding:10px 13px;font:inherit;cursor:pointer;min-height:44px}
  .import-control:focus-within{outline:2px solid #76ccdf}.file-input{position:absolute;width:1px;height:1px;opacity:0}
  #importStatus{font-size:12px;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere;margin:0 0 12px}
  #importStatus:empty,#exportGame:disabled{display:none}
  .toolbar>label.import-control{width:auto;display:inline-flex;align-items:center;justify-content:center}
  button:hover{background:#29415a}button:disabled{opacity:.42;cursor:default}
  button:focus-visible,select:focus-visible,summary:focus-visible,canvas:focus-visible{outline:2px solid #76ccdf;outline-offset:3px}
  [hidden]{display:none!important}
  .grid{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:18px;align-items:stretch}
  .stage{min-width:0;height:562px;position:relative;border:1px solid #314257;border-radius:18px;overflow:hidden;background:#0d1729;box-shadow:0 14px 60px #0008}
  #GameCanvas{display:block;width:100%;height:560px;touch-action:none;user-select:none}
  .corner{position:absolute;pointer-events:none;top:14px;left:18px;font:12px ui-monospace,monospace;color:#8ca2ba}
  .overlay{position:absolute;left:16px;right:16px;bottom:15px;pointer-events:none;text-align:center;font-size:12px;color:#a1b7d1}
  .stage-result{position:absolute;left:12px;right:12px;bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;border:1px solid #65849a;border-radius:12px;background:#101d30;box-shadow:0 4px 20px #0008}
  .stage-result strong,.stage-result span{display:block}.stage-result strong{font-size:18px;color:#f2f8ff}.stage-result span{font-size:13px;line-height:1.4;color:#c4d6e6}.stage-result button{flex:none;white-space:nowrap}
  .playfield{min-width:0}.play-instructions{margin:14px 4px 10px;font-size:16px;overflow-wrap:anywhere}.play-hint{margin:4px;font-size:14px;min-height:1.6em}
  .play-controls{display:flex;gap:12px;align-items:center;justify-content:center;padding:12px;border:1px solid #314257;border-radius:12px;background:#101d30}
  .play-controls #extraActions{flex:1}.play-controls:has(.pad:not([style*="none"])) #extraActions{flex:0 1 50%}
  #resultMessage{min-height:1.6em;font-size:15px;line-height:1.7;margin:10px 0 0}
  .diagnostics{border-top:1px solid #304058;padding-top:14px}.diagnostics summary{cursor:pointer;color:var(--muted);font-size:14px}.diagnostics section{margin-top:14px}
  #sensorControls{margin-bottom:16px}#mobilePanel button{min-height:44px;margin:3px 0}#mobilePanel p{font-size:13px}
  #extraActions{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,100px),1fr));gap:6px}
  #extraActions button{min-width:0;max-width:100%;min-height:44px;padding:9px 8px;font-size:14px;line-height:1.4;overflow-wrap:anywhere}
  #score{white-space:pre-line;font-size:20px;line-height:1.5}
  aside{background:#101d30;border:1px solid #314257;border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:18px;align-self:start}
  aside h2{font-size:13px;text-transform:uppercase;letter-spacing:.1em;color:#88a6be;margin:0 0 8px}
  .stat{font-size:clamp(18px,2.4vw,30px);overflow-wrap:anywhere;letter-spacing:-.045em;font-weight:750}.mono{font:12px ui-monospace,monospace;word-break:break-all;line-height:1.6;color:#9ab7d0}
  .divider{height:1px;background:#304058}
  #status{font-weight:700;color:#74d6b0}#status.warn{color:#ffd88a}#status.error{color:#ff9da0}
  .pad{display:grid;grid-template-columns:repeat(3,56px);justify-content:center;gap:6px}
  .pad button{width:56px;height:48px;padding:4px;white-space:nowrap;user-select:none;touch-action:manipulation;font-size:18px}
  .pad .blank{visibility:hidden}
  #error{color:#ffb6b6;white-space:pre-wrap;font-size:13px;word-break:break-word;display:none}
  #trace{max-height:130px;overflow:auto;white-space:pre-wrap}
  footer{margin-top:20px;color:#657d96;font-size:12px;line-height:1.6}
  @media(max-width:820px){.grid{grid-template-columns:1fr}.stage{height:462px}#GameCanvas{height:460px}}
  @media(max-width:530px){main{padding:14px 10px 26px}header{gap:8px;margin-bottom:12px}header h1{font-size:22px}header p{font-size:13px;margin-bottom:4px}.pill,.corner{display:none}.toolbar{gap:6px}.toolbar>label{width:100%}.toolbar select{width:0;flex:1}.toolbar button,.import-control{font-size:13px;padding:9px 10px;min-height:44px}.stage{height:calc(min(375px,48svh) + 2px)}#GameCanvas{height:min(375px,48svh)}aside{padding:16px}.play-controls{padding:8px;gap:8px}.play-controls.compact{position:sticky;bottom:8px;z-index:2;box-shadow:0 4px 16px #0006}.play-instructions{font-size:15px}.play-controls #extraActions button{font-size:14px}.pad{grid-template-columns:repeat(3,46px)}.pad button{width:46px;height:44px}}
  @media(max-width:530px){.stage-result{position:fixed;left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));z-index:4}}
  </style>
</head>
<body>
<main>
  <header><div><div class="logo">A2Game <span class="tag">/ REFERENCE PLAYER</span></div><h1>选择关卡，开始试玩。</h1><p>使用画面、键盘或下方按钮操作。</p></div><span class="pill">Release 1.0.0 · Spec 0.1.0 · Reference Alpha</span></header>
  <div class="toolbar" style="margin-bottom:16px">
    <label>游戏 <select id="game"><option value="tap-target">点击计分</option><option value="grid-merge">合并网格</option><option value="grid-merge-spawn">随机补位合并</option><option value="grid-push">推箱子</option></select></label>
    <label>后端 <select id="backend"><option value="preview">Canvas2D 预览</option><option value="three">Three.js SDK</option><option value="air">CocosAirJS SDK</option></select></label>
    <button id="restart">重新开始</button><button id="pause">暂停</button>
    <label class="import-control">导入游戏 JSON<input id="importGame" class="file-input" type="file" accept=".json,application/json" aria-label="导入游戏 JSON"/></label>
    <button id="exportGame" disabled>导出内容包</button>
  </div>
  <p id="importStatus" role="status" aria-live="polite"></p>
  <div class="grid">
    <div class="playfield"><div class="stage"><canvas tabindex="0" id="GameCanvas" aria-label="游戏画面" aria-describedby="instructions"></canvas><div class="corner" id="engineLabel">Headless + Canvas2D Preview</div><div class="stage-result" id="stageResult" hidden><div aria-hidden="true"><strong id="stageResultTitle"></strong><span id="stageResultDetail"></span></div><button id="stageRestart" type="button">再玩一次</button></div></div><p class="play-instructions" id="instructions"></p>
      <section class="play-controls" aria-label="游戏操作"><div class="pad"><div class="blank"></div><button data-action="moveUp" aria-label="向上">↑</button><div class="blank"></div><button data-action="moveLeft" aria-label="向左">←</button><button data-action="collect" aria-label="收集">●</button><button data-action="moveRight" aria-label="向右">→</button><div class="blank"></div><button data-action="moveDown" aria-label="向下">↓</button><div class="blank"></div></div><div id="extraActions"></div></section>
      <p class="play-hint" id="hint" role="status"></p></div>
    <aside>
      <section><h2>本局进度</h2><div class="stat" id="score">—</div><div id="status">正在加载</div><p id="resultMessage" role="status" aria-live="polite"></p></section>
      <section id="mobilePanel" hidden>
        <h2>录制与回放</h2>
        <div id="sensorControls" hidden>
        <button id="sensorEnable">启用传感器</button><button id="sensorCalibrate">校准</button><button id="sensorStop">停止采集</button>
        <p id="sensorStatus" role="status">未启动采集，可使用已声明的触控/键盘回退。</p>
        </div>
        <div id="recordingControls"><button id="traceStart">重开并录制输入</button><button id="traceStop">结束录制</button><button id="traceExport" disabled>导出 Trace</button>
        <p id="traceStatus" role="status">仅在选择录制后保存在本页内存，不自动上传。</p>
        </div>
      </section>
      <details class="diagnostics"><summary>运行诊断</summary><section><h2>确定性状态哈希 · SHA-256</h2><div class="mono" id="hash">—</div></section>
      <section><h2>执行信息</h2><div class="mono" id="trace">—</div></section></details>
      <section><div id="error" role="alert"></div></section>
    </aside>
  </div>
  <footer>参考试玩版。Canvas2D 提供预览；CocosAirJS 与 Three.js 使用各自 SDK 呈现相同的游戏规则。</footer>
</main>
<script type="module" src="./main.mjs"></script>
</body>
</html>
