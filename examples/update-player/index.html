<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A2Game 游戏交付</title><style>
:root{color-scheme:dark;font-family:system-ui,"Microsoft YaHei",sans-serif;background:#091722;color:#e6f1ed}*{box-sizing:border-box}body{max-width:1100px;margin:auto;padding:30px 20px}header{border-bottom:1px solid #34545b;padding-bottom:20px}small{color:#8bc5bd;letter-spacing:.15em}h1{font-size:clamp(28px,5vw,42px);margin:12px 0}p{line-height:1.7;color:#afc8c8}nav,.controls{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:20px 0}button,select,a{font:inherit;color:inherit}button,select{min-height:44px;border:1px solid #52737b;border-radius:7px;background:#173540;padding:10px 15px}button{cursor:pointer}button:disabled{opacity:.5;cursor:default}a{color:#8fdcc9}#status{min-height:3em}#player{position:relative;min-height:180px;border:1px solid #34545b;border-radius:10px;overflow:hidden}#empty{padding:40px}footer{font-size:13px;margin-top:22px;color:#91aeb3}[hidden]{display:none!important}button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid #e8c984;outline-offset:3px}@media(max-width:500px){body{padding:20px 12px}.controls select{max-width:100%;width:100%}}</style></head><body>
<header><small>A2GAME / GAME DELIVERY</small><h1>让新版本，稳妥接棒。</h1><p>选择游戏版本，下载核对后再打开。新版本准备失败时保留原版本；需要时可回到上一次选择。</p></header>
<nav><a href="/studio/">创作任务</a><button id="check">检查版本</button><button id="logout" hidden>退出登录</button></nav><div class="controls"><label for="versions">可用作品</label><select id="versions" aria-label="可用作品"></select><button id="load">加载所选版本</button><button id="rollback" disabled>回到上一版</button></div>
<p id="status" role="status">正在读取交付清单…</p><section id="player" aria-label="游戏播放器"><p id="empty">作品会在核对完成后显示在这里。</p></section>
<section id="publishing" hidden><h2>交付已完成作品</h2><p>先在创作任务页完成检查，再选择结果。此操作只发布到本机服务，不上传远端。</p><div class="controls"><select id="jobs" aria-label="已完成创作任务"></select><button id="publish">发布到本机交付列表</button></div></section>
<footer>本机受控演示。来源批准与传输完整性分别核对；正式G3和真机验收独立记录。更新会重新开始游戏。</footer><script type="module" src="./app.mjs"></script></body></html>
