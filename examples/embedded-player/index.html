<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A2Game 嵌入示例</title>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js","cocosair.js":"./vendor/cocosair.js","cannon-es":"./vendor/cannon-es.js"}}</script>
<style>
:root{font-family:system-ui,"Microsoft YaHei",sans-serif;background:#08121d;color:#e2efff}*{box-sizing:border-box}body{max-width:1000px;margin:auto;padding:24px 18px}header{display:flex;justify-content:space-between;gap:16px;align-items:center}h1{font-size:clamp(24px,4vw,36px);margin:10px 0}p{line-height:1.7;color:#b3c9d9}button,select{font:inherit;border:1px solid #527181;background:#162c3c;color:inherit;border-radius:9px;padding:10px 14px;min-height:44px}button{cursor:pointer;touch-action:manipulation}button:disabled{opacity:.45;cursor:default}button[aria-pressed=true]{background:#375b6c}button:focus-visible,select:focus-visible,canvas:focus-visible{outline:2px solid #7ce1d4;outline-offset:3px}#game{position:relative;width:100%;height:min(58vh,540px);min-height:260px;background:#07101a;border:1px solid #355464;border-radius:12px;overflow:hidden}#controls{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}.tools{display:flex;gap:8px;flex-wrap:wrap}#status{min-height:1.7em;font-weight:600}footer{font-size:12px;color:#91a9bc;margin-top:24px}@media(max-width:500px){body{padding:16px 12px}header{align-items:flex-start}#game{height:48vh}#controls button{flex:1 1 95px}}
</style><style>[hidden]{display:none!important}</style></head><body>
<header><div><small>A2GAME / EMBEDDED PLAYER</small><h1 id="title">正在加载内容…</h1></div><label>后端 <select id="backend"><option value="three">Three.js</option><option value="cocosairjs">CocosAirJS</option></select></label></header>
<p id="description"></p><div id="game"></div><p id="status" role="status">加载中…</p><div class="tools"><button id="start" disabled>开始</button><button id="pause" disabled>暂停</button><button id="restart" disabled>重开</button><button id="dispose">销毁</button></div><div id="controls" aria-label="游戏操作"></div>
<section id="deviceControls" class="tools" hidden aria-label="设备输入"><button id="enableSensors" hidden>启用传感器</button><button id="calibrateSensors" hidden>校准</button><button id="disableSensors" hidden>停止传感器</button><button id="enableGamepad" hidden>启用手柄</button><button id="disableGamepad" hidden>停止手柄</button><p id="deviceStatus" role="status"></p></section>
<footer>按游戏声明提供键盘与屏幕按钮。设备采样需显式开启，暂停后需重新启用。切换后端需要重新加载文档。本示例是受审内容的本地嵌入演示，不调用模型。</footer><script type="module" src="./example.mjs"></script></body></html>
