name: A2Game compatibility
on:
  workflow_dispatch:
    inputs:
      full_matrix:
        description: Run all four OS/Node combinations (default is Ubuntu / Node 22 only)
        type: boolean
        default: false
      evidence_url:
        description: HTTPS evidence archive matching project/evidence-lock.json (or configure A2GAME_EVIDENCE_URL repository variable)
        type: string
        required: false
      real_sdk:
        description: Build locked public SDKs and run browser reference gates
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(inputs.full_matrix && '{"os":["ubuntu-latest","windows-latest"],"node":[22,24]}' || '{"os":["ubuntu-latest"],"node":[22]}') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      A2GAME_PYTHON: python
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      A2GAME_VERIFY_DIR: reports/ci-verify-${{ github.run_id }}-${{ matrix.os }}-${{ matrix.node }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install -r requirements-dev.txt
      - name: Restore SHA-pinned reference evidence
        run: npm run evidence:restore
        env:
          A2GAME_EVIDENCE_URL: ${{ inputs.evidence_url || vars.A2GAME_EVIDENCE_URL }}
      - run: npm run verify:receipt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: core-${{ matrix.os }}-node${{ matrix.node }}
          path: ${{ env.A2GAME_VERIFY_DIR }}
          retention-days: 3
  real-sdk:
    needs: core
    if: github.event_name == 'workflow_dispatch' && inputs.real_sdk
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      A2GAME_PYTHON: python
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install -r requirements-dev.txt
      - name: Restore SHA-pinned reference evidence
        run: npm run evidence:restore
        env:
          A2GAME_EVIDENCE_URL: ${{ inputs.evidence_url || vars.A2GAME_EVIDENCE_URL }}
      - run: node scripts/ci-evidence.mjs start
      - run: node scripts/ci-sdks.mjs
      - run: npx playwright install chromium
      - run: npm run g2:real
      - run: npm run candidates:e2e
      - run: npm run variants:e2e
      - run: npm run compat:e2e
      - run: npm run agent:fixture -- --browser
      - run: node scripts/ci-evidence.mjs collect
        if: always()
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: real-sdk-reference
          path: output/ci-artifacts/
          retention-days: 3
